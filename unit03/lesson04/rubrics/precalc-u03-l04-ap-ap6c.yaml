# Rubric for ap_practice item 6(c) (Unit 3, Lesson 3.4). manifest.json points here
# as rubrics/precalc-u03-l04-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "Verify by multiplying that x^3 - 9x^2 + 20x - 12 = (x - 1)(x - 2)(x - 6), give all three solutions of V(x) = 48, and explain why only two of them are possible cut sizes."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Shows the product, e.g. (x - 1)(x - 2) = x^2 - 3x + 2, then (x^2 - 3x + 2)(x - 6) = x^3 - 9x^2 + 20x - 12; gives the solutions x = 1, 2, 6; AND rejects x = 6 in context (a 6-inch cut is more than half the 8-inch side, 8 - 2(6) < 0; a cut must satisfy 0 < x < 4), leaving 1 inch and 2 inches."
    partial: "Partially correct (1): The three solutions 1, 2, 6 with x = 6 rejected in context but no multiplication shown; OR a correct multiplication and the three solutions with no context reason for rejecting 6."
examples:
  - response: "(x - 1)(x - 2) = x^2 - 3x + 2. Times (x - 6): x^3 - 6x^2 - 3x^2 + 18x + 2x - 12 = x^3 - 9x^2 + 20x - 12. So x = 1, 2, 6. You can't cut 6 inches from an 8-inch side, so only 1 or 2 inches."
    scores: {part: 2}
  - response: "x = 1, 2, 6, but 6 is too big for the cardboard."
    scores: {part: 1}
  - response: "x = 1 and x = 2 from the table."
    scores: {part: 0}
