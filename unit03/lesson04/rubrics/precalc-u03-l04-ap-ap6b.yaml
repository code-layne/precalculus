# Rubric for ap_practice item 6(b) (Unit 3, Lesson 3.4). manifest.json points here
# as rubrics/precalc-u03-l04-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Sam divides 4x^3 - 36x^2 + 80x = 0 by 4x, gets x = 4 or x = 5, and says V has only two zeros. Is Sam correct? Explain what his method lost, and how the degree of V shows something is missing."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Says Sam is not correct; names the lost zero x = 0 and why it was lost (dividing by 4x assumes x is not 0, or 4x is a factor that was thrown away); AND uses the degree: V has degree 3, so it has three zeros (0, 4, 5), e.g. by factoring 4x(x - 4)(x - 5)."
    partial: "Partially correct (1): Says Sam is wrong and names x = 0 as the lost zero, but gives no degree argument; OR gives the degree argument (three zeros expected) without identifying x = 0 or why dividing lost it."
examples:
  - response: "No. Dividing by 4x only works if x is not 0, so he lost x = 0. V is degree 3 so it should have 3 zeros: 4x(x - 4)(x - 5) = 0 gives 0, 4, 5."
    scores: {part: 2}
  - response: "No, he forgot x = 0."
    scores: {part: 1}
  - response: "Yes, the zeros are 4 and 5."
    scores: {part: 0}
