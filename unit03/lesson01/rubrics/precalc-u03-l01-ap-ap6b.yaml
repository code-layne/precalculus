# Rubric for ap_practice item 6(b) (Unit 3, Lesson 3.1). manifest.json points here
# as rubrics/precalc-u03-l01-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Find the average rate of change of V over 3 <= t <= 5. Interpret it in context, with units. Was the crowd shrinking for that whole time? Explain."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): (27 - 29)/(5 - 3) = -1 hundred people per hour (or -100 people per hour), interpreted as the crowd shrinking by an average of 100 people per hour from hour 3 to hour 5; AND says no, the crowd grew from 2900 to 3400 until t = 4, then shrank."
    partial: "Partially correct (1): Correct value -1 with units and interpretation but no (or a wrong) answer to whether it shrank the whole time; OR says the crowd grew until t = 4 and then shrank but the rate is wrong (for example -2, the change not divided by 2) or has no units."
examples:
  - response: "(27-29)/2 = -1 hundred people/hr. On average the crowd dropped 100 people an hour from 3 to 5. No, it went up to 3400 at hour 4 first."
    scores: {part: 2}
  - response: "-1 hundred people per hour, so it was shrinking the whole time."
    scores: {part: 1}
  - response: "-2 people."
    scores: {part: 0}
