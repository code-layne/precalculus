# Rubric for ap_practice item 6(c) (Unit 3, Lesson 3.1). manifest.json points here
# as rubrics/precalc-u03-l01-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "An organizer says the crowd peaked at t = 4, so the smallest crowd was at the end, t = 5. Give the absolute maximum and minimum of V on 0 <= t <= 5 and when each occurs, and explain the mistake."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Absolute maximum 3400 people (34 hundred) at t = 4; absolute minimum 200 people (2 hundred) at t = 0; explains that the organizer checked only one endpoint, since V(5) = 2700 is more than V(0) = 200."
    partial: "Partially correct (1): Both absolute extrema correct with times but no explanation of the mistake; OR the explanation is right (the start, t = 0, is lower) but one extremum is reported as a time instead of a crowd size, or without units."
examples:
  - response: "Max 3400 people at 4 hours, min 200 people at 0 hours. He forgot the start: 200 is less than 2700."
    scores: {part: 2}
  - response: "Abs max 34 at t = 4, abs min 2 at t = 0."
    scores: {part: 1}
  - response: "Abs min is 27 at t = 5, the organizer is right."
    scores: {part: 0}
