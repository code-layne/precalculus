# Rubric for ap_practice item 6(a) (Unit 3, Lesson 3.1). manifest.json points here
# as rubrics/precalc-u03-l01-ap-ap6a.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6a
points: 2
task: "Use successive differences to find the degree of V. Show the differences and say how you know."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Shows first differences 5, 11, 11, 5, -7; second 6, 0, -6, -12; third -6, -6, -6; concludes degree 3 because the third differences are the first constant ones (inputs equally spaced)."
    partial: "Partially correct (1): Concludes degree 3 with one arithmetic slip in the differences or without saying why; OR computes all differences correctly but names the wrong degree (for example 2, or 4 by counting rows)."
examples:
  - response: "1st: 5, 11, 11, 5, -7. 2nd: 6, 0, -6, -12. 3rd: -6, -6, -6, all the same, so degree 3."
    scores: {part: 2}
  - response: "Third differences are constant, so it's cubic."
    scores: {part: 1}
  - response: "The outputs go up and then down, so degree 2."
    scores: {part: 0}
