# Rubric for actual_test item 20 (Unit 3, Unit Test: Polynomial Functions).
# manifest.json points here as rubrics/precalc-u03-actual-test-p20.yaml, relative to unit03/tests/.
id: p20
points: 5
task: "x = -2 is a zero of p(x) = x^3 + 3x^2 - 4. Divide p(x) by x + 2, write p(x) factored completely, and list every zero with its multiplicity."
criteria:
  - id: division
    points: 1
    full: "Divides p(x) by x + 2 (synthetic division with -2, or long division), using a 0 placeholder for the missing x term, and gets remainder 0."
  - id: quotient
    points: 1
    full: "States the quotient x^2 + x - 2."
  - id: factored
    points: 1
    full: "Writes p(x) factored completely: (x + 2)^2(x - 1), or (x + 2)(x + 2)(x - 1)."
  - id: zeros
    points: 1
    full: "Lists both zeros, -2 and 1."
  - id: multiplicity
    points: 1
    full: "Gives -2 multiplicity 2 and 1 multiplicity 1."
examples:
  - response: "-2 | 1 3 0 -4 -> 1 1 -2 0. Quotient x^2 + x - 2 = (x + 2)(x - 1). p(x) = (x + 2)^2(x - 1). Zeros -2 (mult. 2), 1 (mult. 1)."
    scores: {division: 1, quotient: 1, factored: 1, zeros: 1, multiplicity: 1}
  - response: "2 | 1 3 0 -4 -> 1 5 10 16. Remainder 16, so x + 2 is not a factor."
    scores: {division: 0, quotient: 0, factored: 0, zeros: 0, multiplicity: 0}
  - response: "Remainder 0, quotient x^2 + x - 2 = (x + 2)(x - 1). p(x) = (x + 2)(x + 2)(x - 1). Zeros -2 and 1."
    scores: {division: 1, quotient: 1, factored: 1, zeros: 1, multiplicity: 0}
