# Rubric for ap_practice item 6(b) (Unit 3, Lesson 3.5). manifest.json points here
# as rubrics/precalc-u03-l05-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Factor q(x) and find every time the company breaks even (profit of $0). Interpret your answer in context."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): q(x) = (x - 3)(x - 5), and states that the company breaks even (profit $0) at 1, 3, and 5 months after launch."
    partial: "Partially correct (1): Correct factoring and zeros 1, 3, 5 with no context (no months / no break-even meaning); OR in context but missing x = 1 or one of 3, 5."
examples:
  - response: "q(x) = (x - 3)(x - 5). Profit is $0 at 1, 3 and 5 months after launch."
    scores: {part: 2}
  - response: "(x - 3)(x - 5), x = 3, 5, 1"
    scores: {part: 1}
  - response: "(x + 3)(x + 5); breaks even at -3 and -5 months."
    scores: {part: 0}
