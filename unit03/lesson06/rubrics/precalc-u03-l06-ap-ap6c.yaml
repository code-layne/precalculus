# Rubric for ap_practice item 6(c) (Unit 3, Lesson 3.6). manifest.json points here
# as rubrics/precalc-u03-l06-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "A redesign G must be a cubic with real coefficients and leading coefficient 1/2 that keeps the zero at x = 1 and has 4 + i as a zero. Write G(x), and explain why the redesigned track meets ground level only once."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Includes the conjugate 4 - i and writes G(x) = (1/2)(x - 1)(x^2 - 8x + 17) (or the equivalent product with both complex factors, or a correct standard form); AND explains that a cubic has exactly three zeros, two of them the non-real pair 4 +/- i, so x = 1 is the only real zero (or that x^2 - 8x + 17 = (x - 4)^2 + 1 is never 0)."
    partial: "Partially correct (1): Correct G(x) with no or an incorrect explanation; OR the conjugate-pair explanation given but G written with an error (missing 1/2, a sign error in the quadratic); OR G written with only the factor (x - (4 + i)), forgetting the conjugate, but with a correct explanation of why the zero 1 is the only real one."
examples:
  - response: "4 - i is also a zero. G(x) = 1/2 (x-1)(x^2 - 8x + 17). The other two zeros are not real, so the track only meets ground level at x = 1."
    scores: {part: 2}
  - response: "G(x) = 1/2 (x-1)(x-(4+i))"
    scores: {part: 0}
  - response: "G(x) = 1/2 (x-1)(x^2-8x+17)"
    scores: {part: 1}
