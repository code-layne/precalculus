# Rubric for ap_practice item 6(c) (Unit 3, Lesson 3.3). manifest.json points here
# as rubrics/precalc-u03-l03-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "k has degree 4 and real coefficients; its graph crosses the t-axis only at t = 0 and t = 3, each straight through, and 4 + i is a zero. List all four zeros of k, and explain how many times the second dolphin is at the surface."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Lists 0, 3, 4 + i, and 4 - i (the conjugate is a zero because the coefficients are real; 1 + 1 + 2 = 4 = the degree); AND explains that only the real zeros are times on the graph, so the dolphin is at the surface twice, at 0 and 3 seconds."
    partial: "Partially correct (1): All four zeros correct but the number of surface times is missing or wrong (for example, four times); OR two surface times explained correctly but the conjugate 4 - i is missing or wrong."
examples:
  - response: "0, 3, 4+i, 4-i. The complex ones are not on the graph, so the dolphin is at the surface 2 times: t = 0 and t = 3."
    scores: {part: 2}
  - response: "0, 3, 4+i, 4-i, so it is at the surface 4 times."
    scores: {part: 1}
  - response: "0, 3, 4 + i. Three times."
    scores: {part: 0}
