# Rubric for ap_practice item 6(b) (Unit 1, Lesson 1.2). manifest.json points here
# as rubrics/precalc-u01-l02-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Find (C - R)(5). Explain how this value is related to (R - C)(5), and why the two are not interchangeable."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): (C - R)(5) = 135 - 90 = 45; states that (R - C)(5) = -45, the opposite; and explains that reversing the order reverses the meaning (C - R is the shortfall, R - C is the profit, negative here)."
    partial: "Partially correct (1): (C - R)(5) = 45 and the two are called opposites (or (R - C)(5) = -45 given) with no explanation of why the order matters; OR the explanation is correct but the value is wrong by one arithmetic error."
examples:
  - response: "(C-R)(5) = 45 and (R-C)(5) = -45. They are opposites; C-R is how much the shop loses, R-C is its profit, so you can't swap them."
    scores: {part: 2}
  - response: "45. They are negatives of each other."
    scores: {part: 1}
  - response: "(C-R)(5) = 45, the same as (R-C)(5) because subtraction works either way."
    scores: {part: 0}
