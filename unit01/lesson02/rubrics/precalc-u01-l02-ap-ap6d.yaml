# Rubric for ap_practice item 6(d) (Unit 1, Lesson 1.2). manifest.json points here
# as rubrics/precalc-u01-l02-ap-ap6d.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6d
points: 2
task: "Let d(x) = x, so that the average revenue per bike is the quotient (R/d)(x). Explain why this quotient has no value at x = 0, and state its domain for the x-values in the table."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Explains that d(0) = 0 makes the denominator zero (division by zero is undefined; no bikes means no per-bike amount) and states the domain as x = 5, 10, 15, 20."
    partial: "Partially correct (1): Gives a correct reason for x = 0 but a missing or wrong domain (e.g. includes 0, or all real numbers except 0 without restricting to the table); OR the correct domain with no or an incorrect reason."
examples:
  - response: "At x = 0, d(0) = 0 and you can't divide by 0. Domain: 5, 10, 15, 20."
    scores: {part: 2}
  - response: "Because you can't divide by zero."
    scores: {part: 1}
  - response: "R(0) = 0 so the average is 0."
    scores: {part: 0}
