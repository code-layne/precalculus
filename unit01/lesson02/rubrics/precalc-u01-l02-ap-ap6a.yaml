# Rubric for ap_practice item 6(a) (Unit 1, Lesson 1.2). manifest.json points here
# as rubrics/precalc-u01-l02-ap-ap6a.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6a
points: 2
task: "Find (R - C)(10) and interpret it in the context of the problem, with units."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): (R - C)(10) = 180 - 150 = 30, interpreted in context with units: when the shop rents 10 bikes in a day, its revenue exceeds its cost by $30 (a profit of 30 dollars)."
    partial: "Partially correct (1): The value 30 is correct but the interpretation is missing, has no units, or does not mention 10 bikes / profit; OR a correct in-context interpretation of a value with one arithmetic error."
examples:
  - response: "(R-C)(10) = 180 - 150 = 30. Renting 10 bikes in a day, the shop makes $30 more than it spends."
    scores: {part: 2}
  - response: "(R-C)(10) = 30"
    scores: {part: 1}
  - response: "(R-C)(10) = 330, the shop earns 330 dollars"
    scores: {part: 0}
