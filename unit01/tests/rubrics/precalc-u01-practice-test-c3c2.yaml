points: 1
task: "Is the tank draining faster or slower as time goes on? Justify with the numbers."
criteria:
  - id: numbers
    points: 1
    full: "Justifies 'slower' with the table: the drop over each 4-minute block shrinks, -32, then -24, then -16 gallons (or equivalent rates -8, -6, -4 gal/min)."
examples:
