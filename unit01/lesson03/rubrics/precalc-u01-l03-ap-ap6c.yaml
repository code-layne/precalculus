# Rubric for ap_practice item 6(c) (Unit 1, Lesson 1.3). manifest.json points here
# as rubrics/precalc-u01-l03-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "Find P(S(2)) and P(S(8)). The two values are equal even though the times are different. Explain what that says about the handoffs."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): S(2) = 6 and S(8) = 6, so P(S(2)) = P(S(8)) = P(6) = 150 kilowatts; explains that the two different times produce the same handoff (6 m/s), and the same handoff must give the same output."
    partial: "Partially correct (1): Both values 150 found, with no or an unclear explanation about the handoffs; OR the explanation names the shared handoff of 6 but one value is misread."
examples:
  - response: "S(2) = 6 and S(8) = 6, both handoffs are 6 m/s, so P(6) = 150 kW both times. Same handoff, same answer."
    scores: {part: 2}
  - response: "Both are 150."
    scores: {part: 1}
  - response: "P(S(2)) = 6 and P(S(8)) = 6"
    scores: {part: 0}
