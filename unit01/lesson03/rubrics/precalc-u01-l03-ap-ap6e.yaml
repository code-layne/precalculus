# Rubric for ap_practice item 6(e) (Unit 1, Lesson 1.3). manifest.json points here
# as rubrics/precalc-u01-l03-ap-ap6e.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6e
points: 2
task: "A gearbox is installed so that the blades feel a wind speed 3 meters per second higher than the air outside: b(s) = s + 3. Write the farm's power output t hours after midnight as a composition of all three functions, then find its value at t = 2, naming both handoffs."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Writes P(b(S(t))); at t = 2 names both handoffs S(2) = 6 m/s and b(6) = 9 m/s and finds P(9) = 500 kilowatts."
    partial: "Partially correct (1): The composition P(b(S(t))) is correct but the value or a handoff is missing or wrong; OR the value 500 is found with both handoffs but the composition is written in the wrong order or not written."
examples:
  - response: "P(b(S(t))). S(2) = 6, b(6) = 9, P(9) = 500 kW."
    scores: {part: 2}
  - response: "P(b(S(2))) = P(b(6)) = P(9) = 500"
    scores: {part: 1}
  - response: "b(P(S(t))) = P(6) + 3 = 153"
    scores: {part: 0}
