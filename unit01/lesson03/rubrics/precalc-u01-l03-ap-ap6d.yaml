# Rubric for ap_practice item 6(d) (Unit 1, Lesson 1.3). manifest.json points here
# as rubrics/precalc-u01-l03-ap-ap6d.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6d
points: 2
task: "Can P(S(10)) be found from these tables? Answer using the handoff."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): No: the handoff is S(10) = 18 meters per second, and the P table has no value at 18, so the composite has no value at t = 10."
    partial: "Partially correct (1): Says no with a reason that does not name the handoff 18 (e.g. 'it is not in the table'); OR names S(10) = 18 but does not conclude that P(18) is unavailable."
examples:
  - response: "No, S(10) = 18 m/s and P only goes up to 12, so P(18) isn't given."
    scores: {part: 2}
  - response: "No, it's not in the table."
    scores: {part: 1}
  - response: "Yes, P(S(10)) = 1100."
    scores: {part: 0}
