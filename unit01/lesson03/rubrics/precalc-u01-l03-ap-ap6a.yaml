# Rubric for ap_practice item 6(a) (Unit 1, Lesson 1.3). manifest.json points here
# as rubrics/precalc-u01-l03-ap-ap6a.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6a
points: 2
task: "Name the handoff in P(S(4)), with its units. Then find P(S(4)) and interpret it in context, with units."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Names the handoff S(4) = 9 meters per second, finds P(S(4)) = P(9) = 500, and interprets it: four hours after midnight the farm produces 500 kilowatts."
    partial: "Partially correct (1): P(S(4)) = 500 with the handoff missing or without units, or with an incomplete interpretation (no time or no units); OR a correct handoff and interpretation with a misread table value."
examples:
  - response: "The handoff is S(4) = 9 m/s. P(9) = 500, so at 4 a.m. the farm makes 500 kilowatts."
    scores: {part: 2}
  - response: "P(S(4)) = 500"
    scores: {part: 1}
  - response: "P(4) = ... S(4) = 9, so the answer is 9 m/s"
    scores: {part: 0}
