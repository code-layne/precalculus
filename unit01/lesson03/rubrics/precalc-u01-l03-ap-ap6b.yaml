# Rubric for ap_practice item 6(b) (Unit 1, Lesson 1.3). manifest.json points here
# as rubrics/precalc-u01-l03-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Explain why S(P(4)) is not a meaningful quantity at this wind farm."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Explains with units: P(4) would be a power in kilowatts, but S accepts only a time in hours, so the handoff has the wrong units and S cannot use it."
    partial: "Partially correct (1): Says P(4) is not in the table (s = 4 is not an input of P) or that the order is wrong, without the units/meaning argument; OR mentions mismatched units without saying which function needs which."
examples:
  - response: "P gives kilowatts, but S needs hours as its input, so you can't feed a power into S."
    scores: {part: 2}
  - response: "4 isn't in the P table."
    scores: {part: 1}
  - response: "S(P(4)) = S(40) because P(3) = 40."
    scores: {part: 0}
