# Rubric for ap_practice item 6(c) (Unit 2, Lesson 2.2). manifest.json points here
# as rubrics/precalc-u02-l02-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "Describe, in order, the transformations that turn the graph of f into the graph of g."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Horizontal shift right 3; vertical stretch by a factor of 2; vertical shift up 1 -- with the stretch before the upward shift (the right shift may come at any point in the order)."
    partial: "Partially correct (1): All three transformations named with one error in direction or order (e.g. left 3, or up 1 before the stretch); OR two of the three correct and the third missing."
examples:
  - response: "Right 3, then vertical stretch by 2, then up 1."
    scores: {part: 2}
  - response: "Left 3, stretch by 2, up 1."
    scores: {part: 1}
  - response: "Right 3 and up 2."
    scores: {part: 0}
