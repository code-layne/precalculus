# Rubric for ap_practice item 6(e) (Unit 2, Lesson 2.2). manifest.json points here
# as rubrics/precalc-u02-l02-ap-ap6e.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6e
points: 2
task: "Write a function j, in terms of f, whose graph is the graph of f reflected over the y-axis and then moved up 4. Which point of j comes from (4, 5)?"
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): j(t) = f(-t) + 4, AND the point (4, 5) maps to (-4, 9)."
    partial: "Partially correct (1): Correct j with an incorrect image point, or the correct point (-4, 9) with j written incorrectly (e.g. -f(t) + 4 or f(-t + 4))."
examples:
  - response: "j(t) = f(-t) + 4; (4, 5) goes to (-4, 9)."
    scores: {part: 2}
  - response: "j(t) = -f(t) + 4, point (-4, 9)"
    scores: {part: 1}
  - response: "j(t) = -f(t) + 4, point (4, -1)"
    scores: {part: 0}
