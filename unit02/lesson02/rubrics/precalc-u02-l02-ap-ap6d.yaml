# Rubric for ap_practice item 6(d) (Unit 2, Lesson 2.2). manifest.json points here
# as rubrics/precalc-u02-l02-ap-ap6d.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6d
points: 2
task: "A third greenhouse runs on a faster cycle, h(t) = f(2t). Kai claims the graph of h passes through (8, 5), because f(4) = 5. Is Kai right? Find the correct point and explain."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): States Kai is wrong; finds the correct point (2, 5) because h(t) uses f(4) when 2t = 4, i.e. t = 2; AND explains that f(2t) is a horizontal compression by a factor of 1/2 (the input change runs backwards), not a stretch."
    partial: "Partially correct (1): States Kai is wrong and gives (2, 5) with no or an incorrect explanation; OR explains the horizontal compression correctly but gives a wrong point."
examples:
  - response: "No. 2t = 4 means t = 2, so the point is (2, 5). f(2t) squeezes the graph toward the y-axis by 1/2, it doesn't stretch it."
    scores: {part: 2}
  - response: "Kai is wrong, the point is (2, 5)."
    scores: {part: 1}
  - response: "Yes, the inside 2 doubles t, so (8, 5)."
    scores: {part: 0}
