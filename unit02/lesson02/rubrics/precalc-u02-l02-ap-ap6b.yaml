# Rubric for ap_practice item 6(b) (Unit 2, Lesson 2.2). manifest.json points here
# as rubrics/precalc-u02-l02-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Find g(5), and name the value of f it used. Interpret g(5) in the context of the problem, with units."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): g(5) = 2f(2) + 1 = 3, names f(2) (= 1) as the value used, AND interprets in context with units: at 5 p.m. (5 hours after noon) the temperature in Greenhouse B is 3 degrees Celsius."
    partial: "Partially correct (1): g(5) = 3 and f(2) named, with no or an incomplete interpretation (no units, or no time/greenhouse); OR a correct interpretation of an incorrect g(5) that follows from one arithmetic error after using f(2)."
examples:
  - response: "g(5) = 2f(2) + 1 = 2(1) + 1 = 3. It used f(2). At 5 p.m. Greenhouse B is 3 degrees C."
    scores: {part: 2}
  - response: "g(5) = 2f(2) + 1 = 3"
    scores: {part: 1}
  - response: "g(5) = 2f(5) + 1, and f(5) is not in the table."
    scores: {part: 0}
