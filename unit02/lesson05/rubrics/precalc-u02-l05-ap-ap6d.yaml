# Rubric for ap_practice item 6(d) (Unit 2, Lesson 2.5). manifest.json points here
# as rubrics/precalc-u02-l05-ap-ap6d.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6d
points: 2
task: "On the interval (3, 6), is W increasing or decreasing, and is it concave up or concave down? Describe in words what the water is doing."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Decreasing and concave down, AND describes the water: it is falling, and falling faster and faster."
    partial: "Partially correct (1): Both 'decreasing' and 'concave down' correct with no or an incorrect description; OR one of the two wrong, with a description consistent with the student's answer."
examples:
  - response: "Decreasing and concave down. The water is going down faster and faster."
    scores: {part: 2}
  - response: "Decreasing, concave down."
    scores: {part: 1}
  - response: "Increasing and concave up; the tide is coming in."
    scores: {part: 0}
