# Partial credit for the work on item 20 when the boxed secant line is wrong (Unit 2 Unit Test).
id: p20
points: 2
task: "Find the secant line of h(x) = cbrt(x - 3) - 1 from x = 2 to x = 11, in slope-intercept form."
answer: "y = (1/3)x - 8/3"
solution: |
  slope = 1/3 (the average rate of change from item 19)
  y - (-2) = (1/3)(x - 2)
  y + 2 = (1/3)x - 2/3
  y = (1/3)x - 8/3
criteria:
  - id: slope
    points: 1
    full: "Uses slope 1/3, or the student's own answer to item 19 carried forward."
  - id: point
    points: 0.5
    full: "Substitutes (2, -2) or (11, 1) into point-slope form with both signs right: y + 2 = m(x - 2) or y - 1 = m(x - 11)."
  - id: solve
    points: 0.5
    full: "Solves their own point-slope equation for y without an algebra slip, ending in slope-intercept form."
examples:
  - response: "y - 2 = 1/3(x - 2), y = 1/3x - 2/3 + 2; boxed 1/3x - 2/3 + 2"
    scores: {slope: 1, point: 0, solve: 0}
  - response: "y + 2 = 1/3(x + 2), y = 1/3x - 4/3"
    scores: {slope: 1, point: 0, solve: 0.5}
  - response: "y - 2 = 1/3(x - 2), y = 1/3x + 4/3"
    scores: {slope: 1, point: 0, solve: 0.5}
