# Partial credit for the work on item 19 when the boxed average rate of change is wrong (Unit 2 Unit Test).
id: p19
points: 2
task: "Find the average rate of change of h(x) = cbrt(x - 3) - 1 from x = 2 to x = 11, as a simplified fraction."
answer: "1/3"
solution: |
  h(2) = cbrt(-1) - 1 = -2
  h(11) = cbrt(8) - 1 = 1
  (h(11) - h(2)) / (11 - 2) = (1 - (-2)) / 9 = 3/9 = 1/3
criteria:
  - id: values
    points: 1
    full: "Evaluates both endpoints correctly: h(2) = -2 and h(11) = 1."
  - id: quotient
    points: 1
    full: "Sets up (h(11) - h(2)) / (11 - 2) with the student's own values, in a consistent order, and computes it without an arithmetic slip."
examples:
  - response: "h(2) = -2, h(11) = 1, (1 - 2)/9 = -1/9"
    scores: {values: 1, quotient: 0}
  - response: "h(2) = 0, h(11) = 1, (1 - 0)/(11 - 2) = 1/9"
    scores: {values: 0, quotient: 1}
