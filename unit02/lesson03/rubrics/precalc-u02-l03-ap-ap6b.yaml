# Rubric for ap_practice item 6(b) (Unit 2, Lesson 2.3). manifest.json points here
# as rubrics/precalc-u02-l03-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Find C^-1(x). Show the swap-and-solve steps."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Swaps the variables (x = 4y + 10) and solves for y to get C^-1(x) = (x - 10)/4 (or equivalent, e.g. x/4 - 5/2), with the swap and solve steps shown."
    partial: "Partially correct (1): Correct inverse with no swap shown or no steps; OR a correct swap with one algebra error in solving (e.g. (x + 10)/4 or x/4 - 10)."
examples:
  - response: "y = 4n + 10 -> x = 4y + 10 -> x - 10 = 4y -> C^-1(x) = (x - 10)/4"
    scores: {part: 2}
  - response: "x = 4y + 10, x + 10 = 4y, y = (x + 10)/4"
    scores: {part: 1}
  - response: "C^-1(x) = 1/(4x + 10)"
    scores: {part: 0}
