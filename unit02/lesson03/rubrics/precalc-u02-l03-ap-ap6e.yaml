# Rubric for ap_practice item 6(e) (Unit 2, Lesson 2.3). manifest.json points here
# as rubrics/precalc-u02-l03-ap-ap6e.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6e
points: 2
task: "Show that C(C^-1(x)) = x. Then explain why C^-1(52) has no meaning in this context."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): Shows C((x - 10)/4) = 4 * (x - 10)/4 + 10 = x, AND explains that C^-1(52) = 10.5 cupcakes, which is not possible because an order holds a whole number of cupcakes."
    partial: "Partially correct (1): The composition is shown correctly with no or an incorrect explanation for 52; OR the explanation (10.5 cupcakes is not a whole order) is correct with the composition missing or containing an error."
examples:
  - response: "C((x - 10)/4) = 4(x - 10)/4 + 10 = x - 10 + 10 = x. C^-1(52) = 10.5, and you can't order half a cupcake."
    scores: {part: 2}
  - response: "4((x - 10)/4) + 10 = x. 52 doesn't work."
    scores: {part: 1}
  - response: "C^-1(52) = 1/52"
    scores: {part: 0}
