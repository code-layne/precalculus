# Rubric for ap_practice item 6(c) (Unit 2, Lesson 2.3). manifest.json points here
# as rubrics/precalc-u02-l03-ap-ap6c.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6c
points: 2
task: "Find C^-1(50). Interpret C^-1(50) in the context of the problem, with units."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): C^-1(50) = (50 - 10)/4 = 10, AND interprets in context with units: an order that costs $50 is 10 cupcakes."
    partial: "Partially correct (1): C^-1(50) = 10 with no or an incomplete interpretation (no units, or input and output swapped, e.g. '10 dollars buys 50 cupcakes'); OR a correct interpretation of a value that follows from an incorrect inverse in part (b)."
examples:
  - response: "C^-1(50) = 10. A $50 order is 10 cupcakes."
    scores: {part: 2}
  - response: "C^-1(50) = 40/4 = 10"
    scores: {part: 1}
  - response: "C^-1(50) = 1/210"
    scores: {part: 0}
