# Rubric for ap_practice item 6(b) (Unit 2, Lesson 2.6). manifest.json points here
# as rubrics/precalc-u02-l06-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Write an equation of the secant line through (0, D(0)) and (4, D(4)). Use it to estimate D(2), then say whether the true value D(2) lies above or below the line."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): The secant line y = 4t (or y - 0 = 4(t - 0)), the estimate 4(2) = 8 thousand, AND the true value D(2) = 12 thousand lies above the line."
    partial: "Partially correct (1): Correct line and estimate 8 with no or an incorrect above/below comparison; OR an incorrect line (one error) with an estimate and comparison that follow correctly from it."
examples:
  - response: "y = 4t. Estimate D(2) = 8. Real D(2) = 12, which is above the line."
    scores: {part: 2}
  - response: "y = 4t, D(2) is about 8."
    scores: {part: 1}
  - response: "y = 16t, D(2) = 32, below"
    scores: {part: 0}
