# Rubric for ap_practice item 6(b) (Unit 2, Lesson 2.1). manifest.json points here
# as rubrics/precalc-u02-l01-ap-ap6b.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6b
points: 2
task: "Write E as a piecewise function with two rules. State where the break between the rules is, and why it is there."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): E(L) = 40 - L (or -(L - 40)) for L < 40 and E(L) = L - 40 for L >= 40 (the boundary L = 40 may go with either rule, but with exactly one), AND the break is at L = 40 because that is where L - 40 changes sign (from negative to positive)."
    partial: "Partially correct (1): Both rules correct with the break at 40 but no or an incorrect reason; OR a correct break and reason with one rule's sign wrong or the boundary included in both or neither condition."
examples:
  - response: "E(L) = -(L - 40) if L < 40, L - 40 if L >= 40. The break is at 40 because L - 40 is negative before 40 and positive after."
    scores: {part: 2}
  - response: "E(L) = 40 - L for L < 40, L - 40 for L >= 40. Break at 40."
    scores: {part: 1}
  - response: "E(L) = L - 40 for L < 40, 40 - L for L > 40"
    scores: {part: 0}
