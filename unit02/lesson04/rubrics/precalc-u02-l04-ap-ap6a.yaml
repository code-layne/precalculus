# Rubric for ap_practice item 6(a) (Unit 2, Lesson 2.4). manifest.json points here
# as rubrics/precalc-u02-l04-ap-ap6a.yaml, relative to this lesson directory.
# AP Precalculus free-response scoring: each part is scored essentially correct (E),
# partially correct (P) or incorrect (I); E = 2 points, P = 1, I = 0.
id: ap6a
points: 2
task: "Find P(0). Interpret your answer in the context of the problem, with units."
criteria:
  - id: part
    points: 2
    full: "Essentially correct (2): P(0) = 9 - 8/1 = 1, AND interprets in context with units: at launch (t = 0 months) the game had 1 thousand (1,000) active players."
    partial: "Partially correct (1): P(0) = 1 with no or an incomplete interpretation (no 'thousand'/players, or no reference to launch); OR a correct interpretation of an incorrect value that follows from one arithmetic error."
examples:
  - response: "P(0) = 1, so when the game launched it had 1,000 active players."
    scores: {part: 2}
  - response: "P(0) = 1 player"
    scores: {part: 1}
  - response: "P(0) = 9 - 8 = 1 month"
    scores: {part: 0}
